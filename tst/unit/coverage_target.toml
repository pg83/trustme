llvm-target = "x86_64-unknown-linux-gnu"
target-endian = "little"
target-pointer-width = "64"

[arch]
name = "x86_64"
pointer-width = 64
alignments = { u128 = 16 }

[backend.c]
target = "x86_64-linux-gnu"
compiler-opts = ["-fwrapv", "-fno-strict-aliasing"]
linker-opts-pre = []
linker-opts-post = []

[custom]
enabled = true
disabled = false
hex = 0x2a
octal = 0o52
binary = 0b101010
negative = -42
empty = ""
literal = 'single quoted'
multiline = """line one
line two"""
literal-multiline = '''raw one
raw two'''
escaped = "quote: \" slash: \\ tab: \t unicode: \u0041"
numbers = [1, 2, 3]
strings = ["one", "two"]
booleans = [true, false]
mixed = [{ ignored = true }, [1, 2]]

[custom.inline]
answer = 42

[[custom.tables]]
name = "first"

[[custom.tables]]
name = "second"
