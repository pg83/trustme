[target]
family = "unix"
os-name = "linux"
env-name = "gnu"

[arch]
name = "x86_64"
pointer-bits = 64
is-big-endian = false
has-atomic-u8 = true
has-atomic-u16 = true
has-atomic-u32 = true
has-atomic-u64 = true
has-atomic-ptr = true
alignments = { u16 = 2, u32 = 4, u64 = 8, u128 = 16, f32 = 4, f64 = 8, ptr = 8 }

[backend.c]
variant = "gnu"
emulate-i128 = false
target = "x86_64-linux-gnu"
compiler-opts = ["-fwrapv", "-fno-strict-aliasing"]
linker-opts-pre = []
linker-opts-post = []

[custom]
enabled = true
disabled = false
hex = 0x2a
octal = 0o52
binary = 0b101010
negative = -42
empty = ""
literal = 'single quoted'
multiline = """line one
line two"""
literal-multiline = '''raw one
raw two'''
escaped = "quote: \" slash: \\ tab: \t unicode: \u0041"
numbers = [1, 2, 3]
strings = ["one", "two"]
booleans = [true, false]
mixed = [{ ignored = true }, [1, 2]]

[custom.inline]
answer = 42

[[custom.tables]]
name = "first"

[[custom.tables]]
name = "second"
