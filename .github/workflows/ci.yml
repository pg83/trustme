name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    if: false
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS: -Werror
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: false

      - name: Build with Clang and LLD
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop .#clang -c \
            ./build -B .build-ci -j "$(nproc)" rustc cargo

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests with coverage
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            ubuntu:26.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends \
                ca-certificates clang curl gdb git golang-go libclang-rt-dev libxxhash-dev libzstd-dev lld llvm patch python3 zlib1g-dev
              export CC="$(command -v clang)"
              export CXX="$(command -v clang++)"
              export LDFLAGS="-fuse-ld=lld"
              (
                while sleep 60; do
                  date -u
                  df -h /workspace
                  free -m
                done
              ) &
              monitor=$!
              trap "kill $monitor 2>/dev/null || true" EXIT
              ./build -B .build-ci -j "$(nproc)" -Dcoverage=1 coverage
              test -s .build-ci/coverage/coverage.info
            '

      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('.build-ci/coverage/summary.txt') != '' }}
        run: |
          {
            echo "## Coverage"
            echo
            echo '```text'
            cat .build-ci/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('.build-ci/coverage/coverage.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: .build-ci/coverage/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-clang-unit

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            .build-ci/coverage/coverage.info
            .build-ci/coverage/summary.txt
            .build-ci/coverage/functions.txt
            .build-ci/coverage/show.txt
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  tests-asan-0:
    if: false
    name: Tests ASan 0/20
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/asan-shard
        with:
          shard: "0"

