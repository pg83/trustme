name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  UBUNTU_IMAGE: ubuntu:26.04
  ALPINE_IMAGE: alpine:3.24.1

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with Clang and glibc
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$UBUNTU_IMAGE" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends clang golang-go lld python3 zlib1g-dev
              clang++ --version
              go version
              export CC="$(command -v clang)"
              export CXX="$(command -v clang++)"
              export LDFLAGS=-fuse-ld=lld
              ./build -B .build-ci -j "$(nproc)" rustc cargo
            '

  tests-musl:
    name: Tests Musl
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test with GCC and musl on Alpine
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$ALPINE_IMAGE" \
            sh -eux -c '
              apk add --no-cache build-base curl go patch python3 zlib-dev
              g++ --version
              go version
              export CC="$(command -v gcc)"
              export CXX="$(command -v g++)"
              ./build -B .build-ci -j "$(nproc)" unit
            '

  tests-asan:
    name: Tests ASan
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test with AddressSanitizer
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$UBUNTU_IMAGE" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends clang curl golang-go libclang-rt-dev lld llvm patch python3 zlib1g-dev
              export CC="$(command -v clang)"
              export CXX="$(command -v clang++)"
              export CXXFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -fPIE"
              export LDFLAGS="-fsanitize=address -fuse-ld=lld -pie"
              export ASAN_OPTIONS="detect_leaks=1:abort_on_error=1"
              clang++ --version
              go version
              ./build -B .build-ci -j "$(nproc)" unit
            '

  tests-ubsan:
    name: Tests UBSan
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test with UndefinedBehaviorSanitizer
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "$UBUNTU_IMAGE" \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install --yes --no-install-recommends clang curl golang-go libclang-rt-dev lld llvm patch python3 zlib1g-dev
              export CC="$(command -v clang)"
              export CXX="$(command -v clang++)"
              export CXXFLAGS="-fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -fPIE"
              export LDFLAGS="-fsanitize=undefined -fuse-ld=lld -pie"
              export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"
              clang++ --version
              go version
              ./build -B .build-ci -j "$(nproc)" unit
            '
