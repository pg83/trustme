name: Run ASan test shard
description: Build with Clang and run one deterministic lite-test shard under ASan

inputs:
  shard:
    description: Zero-based shard index
    required: true
  shard_count:
    description: Total number of shards
    required: true
    default: "20"

runs:
  using: composite
  steps:
    - name: Test lite shard with Clang AddressSanitizer
      shell: bash
      env:
        TEST_GROUP: ${{ inputs.shard }}
        TEST_GROUP_COUNT: ${{ inputs.shard_count }}
      run: |
        docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace \
          --env TEST_GROUP \
          --env TEST_GROUP_COUNT \
          ubuntu:26.04 \
          bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --yes --no-install-recommends \
              ca-certificates clang curl golang-go libclang-rt-dev libxxhash-dev lld llvm patch python3 zlib1g-dev
            clang++ --version
            ld.lld --version
            export CC="$(command -v clang)"
            export CXX="$(command -v clang++)"
            export CFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -fPIE"
            export CXXFLAGS="-fsanitize=address -fno-sanitize-recover=all -fno-omit-frame-pointer -fPIE"
            export LDFLAGS="-fsanitize=address -fuse-ld=lld -pie"
            export ASAN_OPTIONS="detect_leaks=1:abort_on_error=1"
            ./build \
              -B .build-ci \
              -j "$(nproc)" \
              -k \
              -Dgroup="$TEST_GROUP" \
              -Dgroup_count="$TEST_GROUP_COUNT" \
              lite_tests
          '
